<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible AI — Thoughtful Answers with Scripture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-subtle: #12121a;
      --fg: #e8e8ec;
      --muted: #7a7a8a;
      --accent: #c78e3c;
      --accent-soft: #c78e3c15;
      --card: #161620;
      --border: #2a2a3a;
      --quote-bg: #1e1e2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f0e7;
        --bg-subtle: #faf5f0;
        --fg: #1a1a1a;
        --muted: #6b6b7a;
        --accent: #a86e2a;
        --accent-soft: #a86e2a15;
        --card: #ffffff;
        --border: #e0d8d0;
      }
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background texture */
    .bg-texture {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(180deg, var(--bg-subtle) 0%, transparent 50%),
        linear-gradient(90deg, var(--bg-subtle) 0%, transparent 50%);
      background-size: 256px 256px;
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }

    .bg-accent-stripes {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 50%, var(--accent) 100%, transparent 50%);
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      padding: 2rem;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    header h1 {
      font-family: 'Merriweather', serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Chat container */
    .chat-wrapper {
      position: relative;
      z-index: 10;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
    }

    .chat-container {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      min-height: 600px;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.5rem 0;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
      animation: messageIn 0.3s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--bg);
    }

    .avatar.user {
      background: var(--accent);
      color: var(--bg);
    }

    .avatar.ai {
      background: var(--quote-bg);
      color: var(--accent);
    }

    .message-content {
      flex: 1;
      max-width: 85%;
    }

    .message-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .message.user .message-meta {
      text-align: right;
    }

    .message-avatar.user {
      order: 2;
    }

    .message-avatar.ai {
      order: 1;
    }

    .message-text {
      padding: 0.85rem 1rem;
      border-radius: 10px 10px 2px 10px;
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .message.user .message-text {
      background: var(--accent-soft);
      color: var(--fg);
      border-radius: 10px 10px 10px 2px;
    }

    .message.ai .message-text {
      background: var(--quote-bg);
      border: 1px solid var(--border);
      border-radius: 10px 10px 10px 2px;
      color: var(--fg);
    }

    .message-text p {
      margin: 0 0 0.7rem;
    }

    .message-text p:last-child {
      margin-bottom: 0;
    }

    /* Scripture block */
    .verse-block {
      margin: 0 0 0.9rem;
      padding: 0.75rem 0.9rem;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 6px 6px 0;
    }

    .verse-ref {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .verse-text {
      font-family: 'Merriweather', serif;
      font-style: italic;
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--fg);
      margin: 0;
    }

    /* Input area */
    .input-area {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--card);
      gap: 0.8rem;
    }

    .input-area.input-active {
      border-top-color: var(--accent);
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--fg);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0 1.5rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #b67d36;
    }

    button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .message {
        animation: none;
      }
      .message.user .message-text,
      .message.ai .message-text {
        transition: none;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--muted);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="bg-texture"></div>
  <div class="bg-accent-stripes"></div>

  <header>
    <h1><span>Bible</span> AI</h1>
    <p>Thoughtful answers with Scripture</p>
  </header>

  <div class="chat-wrapper">
    <div class="chat-container" id="chatContainer">
      <div class="messages" id="messages">
        <!-- First message will be greeting -->
      </div>
    </div>
  </div>

  <div class="input-area" id="inputArea">
    <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off">
    <button type="button" id="sendBtn">Send</button>
  </div>

  <script>
    // Backend API base URL (Render deployment).
    // Change this if you redeploy the backend elsewhere.
    const API_BASE = 'https://bibleback-aycd.onrender.com';

    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatContainer = document.getElementById('chatContainer');
    const inputArea = document.getElementById('inputArea');

    // Create avatar element
    function createAvatar(className, text) {
      const avatar = document.createElement('div');
      avatar.className = `avatar ${className}`;
      avatar.textContent = text;
      return avatar;
    }

    // Create message element
    function createMessage(isUser, text, verseInfo = '') {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
      
      // Avatar
      const avatar = createAvatar(
        isUser ? 'user' : 'ai',
        isUser ? 'U' : 'AI'
      );
      
      // Content wrapper
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      
      // Meta line
      const metaDiv = document.createElement('div');
      metaDiv.className = 'message-meta';
      metaDiv.textContent = isUser ? 'You' : 'Bible AI';
      contentDiv.appendChild(metaDiv);
      
      const textDiv = document.createElement('div');
      textDiv.className = 'message-text';

      // Verse block (rendered above the reflection, once)
      if (!isUser && verseInfo && verseInfo.reference) {
        const verseBlock = document.createElement('div');
        verseBlock.className = 'verse-block';

        const ref = document.createElement('div');
        ref.className = 'verse-ref';
        ref.textContent = verseInfo.reference;

        const quote = document.createElement('blockquote');
        quote.className = 'verse-text';
        quote.textContent = verseInfo.text;

        verseBlock.appendChild(ref);
        verseBlock.appendChild(quote);
        textDiv.appendChild(verseBlock);
      }

      // Reflection text as safe paragraphs
      const paragraphs = String(text || '').split(/\n{1,}/).filter(function (p) {
        return p.trim().length > 0;
      });
      paragraphs.forEach(function (p) {
        const para = document.createElement('p');
        para.textContent = p.trim();
        textDiv.appendChild(para);
      });

      contentDiv.appendChild(textDiv);
      
      // Assemble message
      messageDiv.appendChild(avatar);
      messageDiv.appendChild(contentDiv);
      
      return messageDiv;
    }

    // Convert newlines to br tags
    function nl2br(text) {
      if (!text) return '';
      return text.replace(/\n/g, '<br><br>');
    }

    // Add message to DOM
    function addMessage(isUser, text, verseInfo = '') {
      const msgDiv = createMessage(isUser, text, verseInfo);
      messagesDiv.appendChild(msgDiv);
      
      // Scroll to bottom
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Show typing state
    function showTyping() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message ai';
      typingDiv.id = 'typingMessage';
      typingDiv.innerHTML = `
        <div class="avatar ai"></div>
        <div class="message-content">
          <div class="message-meta">Bible AI</div>
          <div class="message-text"><em>Thinking...</em></div>
        </div>
      `;
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return typingDiv;
    }

    // Hide typing state
    function hideTyping() {
      const typingMsg = document.getElementById('typingMessage');
      if (typingMsg) {
        typingMsg.remove();
      }
    }

    // Send message
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // Add user message
      addMessage(true, text);
      userInput.value = '';
      inputArea.classList.remove('input-active');
      
      // Show typing state. Render free tier can cold-start, so hint after a wait.
      showTyping();
      const slowHint = setTimeout(setTypingText, 7000, 'Waking the server\u2026 this can take up to a minute.');

      try {
        const res = await postWithRetry(API_BASE + '/api/chat', { message: text });
        clearTimeout(slowHint);
        hideTyping();

        if (!res.ok) {
          let detail = '';
          try { detail = (await res.json()).error || ''; } catch (e) {}
          addMessage(false, detail
            ? 'The server could not answer right now (' + detail + '). Please try again.'
            : 'The server could not answer right now. Please try again.');
          return;
        }

        const data = await res.json();

        // Add AI response
        addMessage(false, data.response, {
          reference: data.verseReference || '',
          text: data.verseText || ''
        });
      } catch (err) {
        clearTimeout(slowHint);
        hideTyping();
        addMessage(false, 'Could not reach the server. Check your connection and try again.');
      }
    }

    // POST with one retry for cold starts / transient network failures
    async function postWithRetry(url, payload) {
      const opts = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      };
      try {
        const res = await fetch(url, opts);
        if (res.status >= 500) throw new Error('server ' + res.status);
        return res;
      } catch (err) {
        await new Promise(function (r) { setTimeout(r, 1500); });
        return fetch(url, opts);
      }
    }

    function setTypingText(message) {
      const el = document.querySelector('#typingMessage .message-text');
      if (el) el.textContent = message;
    }

    // Enter key to send
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Focus input on load
    setTimeout(() => userInput.focus(), 300);

    // Input focus styling
    userInput.addEventListener('focus', () => {
      inputArea.classList.add('input-active');
    });

    userInput.addEventListener('blur', () => {
      setTimeout(() => inputArea.classList.remove('input-active'), 150);
    });
  </script>
</body>
</html>
